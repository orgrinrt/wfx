[workspace]
members = [
    "./src/core",
    "./src/runtime",
    "./src/crates/*",
]
resolver = "2" # TODO: once bevy and other key deps requiring 2 are updated, switch to 3

[workspace.dependencies]
# a version requirement, because crates.io rejects a wildcard server-side even though a local
# dry-run accepts it. The features trim the log levels compiled into a release build.
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
bevy = { version = "0.16.0", features = ["dynamic_linking", "experimental_pbr_pcss", "async-io", "async_executor"] }

[profile.dev]
codegen-backend = "cranelift" # NOTE: might be unstable on macos
opt-level = 1

[profile.dev.package."*"]
codegen-backend = "llvm"
opt-level = 3

[profile.release]
codegen-backend = "llvm"
codegen-units = 1
lto = "thin"

[profile.wasm-release]
codegen-backend = "llvm"
inherits = "release"
opt-level = "z" # or `s`
strip = "debuginfo"
